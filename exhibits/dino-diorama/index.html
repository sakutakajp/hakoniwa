<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fae8d4" />
    <title>Jurassic River Diorama</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="scene" tabindex="0" role="img" aria-label="暖かいベージュの床に置かれた、角丸の四角い地面の塊の箱庭。ジュラ紀の川辺の森。切り口には暗い茶色の表土と、明るい石灰岩の塊を積んだ層が見える。右奥の高台の林の湧き水から流れ出した水が、苔むした岩のあいだを 3 段の滝になって落ち、澄んだターコイズの川が砂浜の左岸に沿って流れ、手前の中央右で切り口を横切って、ガラスのような水の断面に川底の砂と苔むした岩が透けて見える。左岸の砂浜の奥には開けた草地が広がり、左奥は背の高いアラウカリアやマツと明るい緑の広葉樹の幹が並ぶ林で、林の縁と右岸にはシダやソテツが茂る。右岸には水際の砂地と岩、倒木がある。ドラッグで向きを変え、ホイールやピンチで拡大縮小、ダブルクリックで元の向きに戻せる。キーボードでは矢印キーで回転、＋と−で拡大縮小、0 で元に戻す"></canvas>
    <p id="scene-message" class="scene-message" role="status" hidden></p>
    <p id="scene-hint" class="scene-hint" aria-hidden="true" hidden></p>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
