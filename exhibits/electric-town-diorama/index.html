<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fae8d4" />
    <title>Electric Town Diorama</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="scene" tabindex="0" role="img" aria-label="暖かいベージュの床に置かれた、角丸の四角い灰色の路面の塊の箱庭。夕暮れの電気街の交差点。手前に雨に濡れた車道が V 字に分かれ、白線と横断歩道があり、店や街灯の明かりが水たまりに映る。白いワゴン車と黄色いタクシーが走る。奥は中央の路地をはさんで左右に雑居ビルが建ち並び、窓の明かり、商品の並ぶ明るい店先、青と白のしま模様や赤の日よけ、ゲーム機や電車・車・飛行機・ロボットの絵の大きな縦長の看板、縦の電飾看板が光る。屋上には室外機やアンテナ、鉄塔、木があり、建物の横には非常階段、通りには電柱と電線、街灯、街路樹、車止め、自転車、自動販売機、歩く人々。ドラッグで向きを変え、ホイールやピンチで拡大縮小、ダブルクリックで元の向きに戻せる。キーボードでは矢印キーで回転、＋と−で拡大縮小、0 で元に戻す"></canvas>
    <p id="scene-message" class="scene-message" role="status" hidden></p>
    <p id="scene-hint" class="scene-hint" aria-hidden="true" hidden></p>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
