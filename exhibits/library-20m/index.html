<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fae8d4" />
    <title>図書館20m比較試作</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="scene" tabindex="0" role="img" aria-label="暖かいベージュの床に置かれた、四隅の丸い正方形の大理石の台の上の、歴史ある図書館20m比較試作。壁は奥と左だけで、手前と右が開いた切り取りの部屋。床はクリームと灰色の大理石を斜めに張った市松模様で、開いた縁に濃い石の縁取り、手前に象嵌の方位の星。床には4枚のペルシャ絨毯と4卓の長机、それぞれに緑の色ガラスの笠のランプが3つと開いた本、合計24脚の閲覧椅子。左と奥の 1 階は、戸棚の上に本の並ぶ明るい古材の本棚で、柱形に真鍮の燭台が灯り、梯子を掛ける真鍮の手すりが通る。左と奥をめぐる回廊には真鍮の手すり子が並び、回廊の下の帯には学問の名が金文字で入る。2 階は左の壁にアーチの本棚が並び、奥の石の壁にはまん中に大きなセルリアーナの窓、両脇にアーチの窓。窓から差し込む日差しが光の筋になり、長机と敷物、肘掛け椅子に窓の形の光を落とす。奥の右には回廊へ上るらせん階段、右に地球儀と天球儀、右の手前にガラスの蓋の陳列台と彩色写本、本の手押し車と書見台、左の手前に緑の革の肘掛け椅子と黄色い笠のランプの小机。ドラッグで向きを変え、ホイールやピンチで拡大縮小、ダブルクリックで元の向きに戻せる。キーボードでは矢印キーで回転、＋と−で拡大縮小、0 で元に戻す"></canvas>
    <p id="scene-message" class="scene-message" role="status" hidden></p>
    <p id="scene-hint" class="scene-hint" aria-hidden="true" hidden></p>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
