<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fae8d4" />
    <title>NYC Diorama</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="scene" tabindex="0" role="img" aria-label="暖かいベージュの床に置かれた、角丸の透明な水の塊の中のニューヨークの島（ロウアー・マンハッタン）の箱庭。島のまわりを海沿いの通りが一周し、東西の大通りと南北の通りが交わる。奥には青いガラスのワン・ワールド・トレード・センター（赤白のアンテナ）と、尖塔のあるエンパイア・ステート・ビルが並び、緑の銅の屋根の塔、赤れんがやベージュや灰色のビル、屋上の木の給水タンク、池のある公園と並木、黄色いタクシーと横断歩道がある。手前の川には、杭の上に建つガラス張りの上屋の桟橋と、白い航跡を引いて進むフェリー。右手前には、海沿いの通りをまたいで岸の石の橋台へ上がり、星条旗を掲げた石の主塔から吊りケーブルで川を斜めに渡るブルックリン橋が、台座の縁で切れている。側面のガラスのような断面には、水面の近くの青緑から下の川底の明るい砂へ移る水と、主塔の基礎や桟橋の杭が透けて見える。ドラッグで向きを変え、ホイールやピンチで拡大縮小、ダブルクリックで元の向きに戻せる。キーボードでは矢印キーで回転、＋と−で拡大縮小、0 で元に戻す"></canvas>
    <p id="scene-message" class="scene-message" role="status" hidden></p>
    <p id="scene-hint" class="scene-hint" aria-hidden="true" hidden></p>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
