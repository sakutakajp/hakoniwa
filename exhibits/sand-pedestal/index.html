<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fae8d4" />
    <title>Sand Pedestal</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="scene" tabindex="0" role="img" aria-label="暖かいベージュの床に置かれた、角丸の透明な水の塊の小さな海。左から奥を回って右の岬へ続く C 字形の石灰岩の島が入り江を囲み、内側には白い砂浜、岬の足もとには海食洞がある。島の上は森に覆われ、尾根に細い小道が通る。波打ち際には大きな岩が並び、白い泡が寄せる。入り江の浅瀬はエメラルドからターコイズ、沖は深い青で、側面のガラスのような断面は、水面の近くの青緑（沖は濃い青）から下の海底の明るい色へなだらかに移り、海底の砂と揺れる光の網目、藻をまとった茶色の岩の集まりが透けて見える。ドラッグで向きを変え、ホイールやピンチで拡大縮小、ダブルクリックで元の向きに戻せる。キーボードでは矢印キーで回転、＋と−で拡大縮小、0 で元に戻す"></canvas>
    <p id="scene-message" class="scene-message" role="status" hidden></p>
    <p id="scene-hint" class="scene-hint" aria-hidden="true" hidden></p>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
